<!-- @dsCard group="Expert Voices" viewport="1000x640" name="Expert Voices carousel" subtitle="Square LinkedIn carousel, themed per sector" -->
<!doctype html><html><head><meta charset="utf-8"><title>Infoquest — Expert Voices</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script>
<style>body{background:#E9E9E9;margin:0}</style></head><body><div id="root"></div>
<script type="text/babel" src="EVFrame.jsx"></script>
<script type="text/babel" src="EVSlides.jsx"></script>
<script type="text/babel">
(()=>{const {Button}=window.InfoquestDesignSystem_80b250;
function App(){const [i,setI]=React.useState(+(localStorage.getItem('iq-ev-i')||0));const [t,setT]=React.useState(localStorage.getItem('iq-ev-t')||'banking');
 React.useEffect(()=>{localStorage.setItem('iq-ev-i',i);localStorage.setItem('iq-ev-t',t)},[i,t]);
 const S=EV_SLIDES,th=EV_THEMES[t],n=9,scale=.5;
 React.useEffect(()=>{const k=e=>{if(e.key==='ArrowRight')setI(x=>Math.min(S.length-1,x+1));if(e.key==='ArrowLeft')setI(x=>Math.max(0,x-1));};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
 return <div style={{display:"flex",gap:28,padding:28,alignItems:"flex-start",justifyContent:"center",flexWrap:"wrap"}}>
  <div style={{width:1080*scale,height:1080*scale,overflow:"hidden",flex:"none"}}><div style={{transform:"scale("+scale+")",transformOrigin:"0 0"}}>{React.createElement(S[i],{th,n})}</div></div>
  <div style={{display:"flex",flexDirection:"column",gap:18,width:300}}>
   <div><div style={{font:"700 13px var(--font-display)",marginBottom:8}}>Sector theme</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{Object.entries(EV_THEMES).map(([k,v])=><Button key={k} size="sm" variant={k===t?"dark":"outline"} onClick={()=>setT(k)}>{v.name}</Button>)}</div></div>
   <div><div style={{font:"700 13px var(--font-display)",marginBottom:8}}>Slide {i+1} of {S.length}</div><div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>{S.map((C,j)=><button key={j} onClick={()=>setI(j)} style={{padding:0,border:j===i?"2px solid var(--iq-purple-600)":"2px solid transparent",background:"none",cursor:"pointer",height:54,overflow:"hidden"}}><div style={{transform:"scale(.0463)",transformOrigin:"0 0",pointerEvents:"none"}}>{React.createElement(C,{th,n})}</div></button>)}</div></div>
   <div style={{display:"flex",gap:8}}><Button size="sm" variant="outline" disabled={i===0} onClick={()=>setI(i-1)}>← Prev</Button><Button size="sm" disabled={i===S.length-1} onClick={()=>setI(i+1)}>Next →</Button></div>
   <p style={{fontSize:12,color:"var(--text-secondary)",margin:0}}>Copy is from the Saudi Banking carousel; themes recolor it to the Insurance, Data Center and Fintech palettes. Arrow keys navigate.</p>
  </div></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);})();
</script></body></html>
