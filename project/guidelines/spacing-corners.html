<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;font-family:var(--font-text)}.sw{display:flex;gap:8px}.s{flex:1;min-width:0}.s i{display:block;height:64px}.s b{display:block;font:600 11px var(--font-text);margin-top:6px;color:var(--text-primary)}.s span{display:block;font:400 10px var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:20px;align-items:center"><div style="width:120px;height:80px;background:var(--surface-card);display:flex;align-items:center;justify-content:center;font-size:11px">radius 0</div><div style="width:120px;height:80px;background:var(--surface-card-accent);display:flex;align-items:center;justify-content:center;font-size:11px">no shadow</div><div style="height:80px;border-left:1px solid var(--gray-500);padding-left:12px;font-size:11px;display:flex;align-items:center">1px grey<br>hairline</div><div style="width:36px;height:36px;border-radius:9999px;background:var(--iq-purple-600);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center">1</div><div style="font-size:11px;color:var(--text-secondary)">circle only for<br>step dots & checks</div></div></body></html>
